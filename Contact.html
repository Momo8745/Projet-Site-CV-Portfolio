<body>
  <header>
    <h1>Contactez-nous</h1>
  </header>

  <main>
    <section id="contact">
      <h2>Contactez-nous</h2>
      <form action="mailto:votre-email@example.com" method="POST" enctype="text/plain">
        <label for="name">Nom :</label>
        <input type="text" id="name" name="name" placeholder="Votre nom" required>

        <label for="email">Email :</label>
        <input type="email" id="email" name="email" placeholder="Votre email" required>

        <label for="message">Message :</label>
        <textarea id="message" name="message" placeholder="Votre message" required></textarea>

        <button type="submit"><i class="fa fa-paper-plane"></i> Envoyer</button>
      </form>

      <div class="contact-details">
        <p><i class="fa fa-phone"></i> Contactez-nous au : <strong>+33 6 12 34 56 78</strong></p>
        <p><i class="fa fa-envelope"></i> Email : <strong>contact@monentreprise.fr</strong></p>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 - Mon Site Perso</p>
  </footer>
</body>
</html>
